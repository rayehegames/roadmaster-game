
name: Build RoadMaster Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-apk-build
    paths:
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/io/github/rayehegames/twa
          mkdir -p app/src/main

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RoadMaster"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'io.github.rayehegames.twa'
              compileSdk 35

              defaultConfig {
                  applicationId 'io.github.rayehegames.twa'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>

              <application
                  android:label="فرمانروای جاده"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/io/github/rayehegames/twa/MainActivity.java <<'EOF'
          package io.github.rayehegames.twa;

          import android.app.Activity;
          import android.os.Bundle;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.webkit.*;
          import android.view.View;
          import java.util.ArrayList;

          public class MainActivity extends Activity {

              private WebView webView;
              private PermissionRequest pendingCamera;
              private GeolocationPermissions.Callback pendingLocation;
              private String pendingOrigin;

              private static final int CAMERA_CODE = 10;
              private static final int LOCATION_CODE = 11;

              private static final String GAME_URL =
                  "https://rayehegames.github.io/roadmaster-game/";

              private boolean trusted(String origin) {
                  return origin != null &&
                      origin.startsWith("https://rayehegames.github.io");
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_FULLSCREEN |
                      View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                  );

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF141212);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setGeolocationEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(true);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());

                  webView.setWebChromeClient(new WebChromeClient() {

                      @Override
                      public void onPermissionRequest(PermissionRequest request) {
                          runOnUiThread(() -> {
                              if (!trusted(request.getOrigin().toString())) {
                                  request.deny();
                                  return;
                              }

                              boolean wantsCamera = false;
                              for (String resource : request.getResources()) {
                                  if (resource.equals(
                                      PermissionRequest.RESOURCE_VIDEO_CAPTURE)) {
                                      wantsCamera = true;
                                  }
                              }

                              if (!wantsCamera) {
                                  request.deny();
                                  return;
                              }

                              if (checkSelfPermission(Manifest.permission.CAMERA)
                                  == PackageManager.PERMISSION_GRANTED) {
                                  request.grant(new String[]{
                                      PermissionRequest.RESOURCE_VIDEO_CAPTURE
                                  });
                              } else {
                                  pendingCamera = request;
                                  requestPermissions(
                                      new String[]{Manifest.permission.CAMERA},
                                      CAMERA_CODE
                                  );
                              }
                          });
                      }

                      @Override
                      public void onGeolocationPermissionsShowPrompt(
                          String origin,
                          GeolocationPermissions.Callback callback) {

                          if (!trusted(origin)) {
                              callback.invoke(origin, false, false);
                              return;
                          }

                          if (checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED ||
                              checkSelfPermission(
                              Manifest.permission.ACCESS_COARSE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED) {

                              callback.invoke(origin, true, false);
                          } else {
                              pendingLocation = callback;
                              pendingOrigin = origin;
                              requestPermissions(
                                  new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                                  },
                                  LOCATION_CODE
                              );
                          }
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl(GAME_URL);
              }

              @Override
              public void onRequestPermissionsResult(
                  int requestCode,
                  String[] permissions,
                  int[] results) {

                  super.onRequestPermissionsResult(
                      requestCode, permissions, results);

                  if (requestCode == CAMERA_CODE && pendingCamera != null) {
                      if (checkSelfPermission(Manifest.permission.CAMERA)
                          == PackageManager.PERMISSION_GRANTED) {
                          pendingCamera.grant(new String[]{
                              PermissionRequest.RESOURCE_VIDEO_CAPTURE
                          });
                      } else {
                          pendingCamera.deny();
                      }
                      pendingCamera = null;
                  }

                  if (requestCode == LOCATION_CODE && pendingLocation != null) {
                      boolean granted =
                          checkSelfPermission(
                              Manifest.permission.ACCESS_FINE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED ||
                          checkSelfPermission(
                              Manifest.permission.ACCESS_COARSE_LOCATION)
                              == PackageManager.PERMISSION_GRANTED;

                      pendingLocation.invoke(
                          pendingOrigin, granted, false);

                      pendingLocation = null;
                      pendingOrigin = null;
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (webView != null) {
                      webView.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadMaster-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
